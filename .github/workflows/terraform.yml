# =============================================================================
# Dual-VPC platform — GitHub Actions
# -----------------------------------------------------------------------------
# Branch  →  environment
#   dev   →  environments/dev.tfvars    (plan + apply)
#   uat   →  environments/uat.tfvars    (plan + apply)
#   prod  →  environments/prod.tfvars   (plan + apply)
#
# Multi-party approval:
#   Create GitHub Environments named
#     plan-dev, apply-dev, plan-uat, apply-uat, plan-prod, apply-prod
#   and attach Required reviewers (2+ for prod). Jobs will not start until
#   those reviewers approve in the Actions UI.
#
# Authentication:
#   AWS keys are copied from the laptop into repository Secrets
#   (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, optional AWS_SESSION_TOKEN).
#   There is no OIDC / GitHub IAM role.
# =============================================================================

name: 🏗️ Terraform

on:
  push:
    branches: [dev, develop, uat, staging, prod, main]
  pull_request:
    branches: [dev, develop, uat, staging, prod, main]
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        required: true
        type: choice
        default: plan
        options: [plan, apply, destroy, showcase]
      environment:
        description: Environment (from-branch uses the Git branch name)
        required: true
        type: choice
        default: from-branch
        options: [from-branch, dev, uat, prod]

concurrency:
  group: terraform-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  TF_VERSION: "1.10.5"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  meta:
    name: 🧭 Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      tfvars: ${{ steps.resolve.outputs.tfvars }}
      action: ${{ steps.resolve.outputs.action }}
    steps:
      - id: resolve
        name: Map branch → env
        shell: bash
        run: |
          set -euo pipefail
          ACTION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action || 'plan' }}"
          OVERRIDE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'from-branch' }}"
          if [[ "${OVERRIDE}" == "from-branch" ]]; then OVERRIDE=""; fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if [[ -n "${OVERRIDE}" ]]; then
            ENV="${OVERRIDE}"
          else
            case "${BRANCH}" in
              dev|develop)        ENV=dev  ;;
              uat|staging)        ENV=uat  ;;
              prod|main|master)   ENV=prod ;;
              *)
                echo "Branch '${BRANCH}' is not one of dev|uat|prod (or develop/staging/main)."
                exit 1
                ;;
            esac
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            ACTION=apply
          fi

          echo "environment=${ENV}" >> "${GITHUB_OUTPUT}"
          echo "tfvars=environments/${ENV}.tfvars" >> "${GITHUB_OUTPUT}"
          echo "action=${ACTION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ENV=${ENV} ACTION=${ACTION} BRANCH=${BRANCH}"

  fmt:
    name: 🧹 Format & validate
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (backend=false)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  plan:
    name: 📋 Plan (${{ needs.meta.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [meta, fmt]
    if: needs.meta.outputs.action != 'destroy' && needs.meta.outputs.action != 'showcase'
    environment: plan-${{ needs.meta.outputs.environment }}
    defaults:
      run:
        shell: bash
    outputs:
      add: ${{ steps.stats.outputs.add }}
      change: ${{ steps.stats.outputs.change }}
      destroy: ${{ steps.stats.outputs.destroy }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS CLI region
        run: aws configure set region "${AWS_REGION}"

      - name: terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="backend-configs/${{ needs.meta.outputs.environment }}.hcl" \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode \
            -var-file="${{ needs.meta.outputs.tfvars }}" \
            -out=tfplan \
            -no-color | tee plan.txt
          STATUS=${PIPESTATUS[0]}
          echo "plan_exit=${STATUS}" >> "${GITHUB_OUTPUT}"
          # 0 = no changes, 2 = changes, anything else = error
          if [[ "${STATUS}" -eq 0 || "${STATUS}" -eq 2 ]]; then
            exit 0
          fi
          exit "${STATUS}"

      - name: Capture plan statistics
        id: stats
        run: |
          # terraform plan -detailed-exitcode: 0=no change, 1=error, 2=changes
          EXIT="${{ steps.plan.outcome }}"
          # Re-run show against the plan file when it exists
          if [[ -f tfplan ]]; then
            terraform show -no-color -json tfplan > plan.json
            ADD=$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' plan.json)
            CHANGE=$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' plan.json)
            DESTROY=$(jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length' plan.json)
          else
            ADD=0; CHANGE=0; DESTROY=0
          fi
          echo "add=${ADD}" >> "${GITHUB_OUTPUT}"
          echo "change=${CHANGE}" >> "${GITHUB_OUTPUT}"
          echo "destroy=${DESTROY}" >> "${GITHUB_OUTPUT}"
          {
            echo "## 📋 Terraform plan — \`${{ needs.meta.outputs.environment }}\`"
            echo ""
            echo "| ➕ Create | 🔁 Update | ➖ Destroy |"
            echo "| ---: | ---: | ---: |"
            echo "| ${ADD} | ${CHANGE} | ${DESTROY} |"
            echo ""
            echo "<details><summary>Plan output</summary>"
            echo ""
            echo '```'
            tail -n 120 plan.txt || true
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.meta.outputs.environment }}
          path: |
            tfplan
            plan.txt
          retention-days: 5
          if-no-files-found: error

      - name: Comment plan on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const add = '${{ steps.stats.outputs.add }}';
            const change = '${{ steps.stats.outputs.change }}';
            const destroy = '${{ steps.stats.outputs.destroy }}';
            const env = '${{ needs.meta.outputs.environment }}';
            const body = [
              `## 📋 Terraform plan (\`${env}\`)`,
              ``,
              `| ➕ Create | 🔁 Update | ➖ Destroy |`,
              `| ---: | ---: | ---: |`,
              `| ${add} | ${change} | ${destroy} |`,
              ``,
              `_Full plan is attached as artifact \`tfplan-${env}\` and in the job summary._`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    name: 🚀 Apply (${{ needs.meta.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [meta, plan]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      github.event_name != 'pull_request' &&
      (needs.meta.outputs.action == 'apply' || github.event_name == 'push')
    environment: apply-${{ needs.meta.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS CLI region
        run: aws configure set region "${AWS_REGION}"

      - name: terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="backend-configs/${{ needs.meta.outputs.environment }}.hcl" \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.meta.outputs.environment }}

      - name: terraform apply
        run: terraform apply -input=false -no-color tfplan

      - name: Write apply summary
        run: |
          {
            echo "## 🚀 Apply complete — \`${{ needs.meta.outputs.environment }}\`"
            echo ""
            echo "Saved plan applied. Showcase job will publish the live inventory."
          } >> "${GITHUB_STEP_SUMMARY}"

  showcase:
    name: 🛰️ Showcase live infra
    runs-on: ubuntu-latest
    needs: [meta, apply]
    if: |
      always() &&
      (needs.apply.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.meta.outputs.action == 'showcase'))
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS CLI region
        run: aws configure set region "${AWS_REGION}"

      - name: terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="backend-configs/${{ needs.meta.outputs.environment }}.hcl" \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Showcase
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          chmod +x scripts/showcase.sh
          ./scripts/showcase.sh

  destroy:
    name: 💣 Destroy (${{ needs.meta.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [meta, fmt]
    if: github.event_name == 'workflow_dispatch' && needs.meta.outputs.action == 'destroy'
    environment: apply-${{ needs.meta.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS CLI region
        run: aws configure set region "${AWS_REGION}"

      - name: terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="backend-configs/${{ needs.meta.outputs.environment }}.hcl" \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Disable deletion protection (prod)
        run: |
          terraform apply -input=false -auto-approve \
            -var-file="${{ needs.meta.outputs.tfvars }}" \
            -var="enable_deletion_protection=false" \
            -target=module.public_alb \
            -target=module.internal_alb || true

      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve -var-file="${{ needs.meta.outputs.tfvars }}"

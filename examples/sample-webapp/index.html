<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sample webapp</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family: ui-sans-serif, system-ui, sans-serif; background:#0b1220; color:#e8eefc; }
    .card { background:#151d2e; border:1px solid #2a3a5a; border-radius:16px; padding:36px 44px; max-width:560px; }
    .badge { background:#238636; color:#fff; border-radius:999px; padding:2px 10px; font-size:.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">container</span>
    <h1>🐳 Hello from GitHub</h1>
    <p>This page was built from a Dockerfile in your repository, cloned with a GitHub PAT from SSM, and served by Docker on the private-VPC ASG.</p>
  </div>
</body>
</html>
